<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Journal — Coast Homes by Aja</title>
  <meta name="description" content="Market reads, neighborhood walks, and honest real estate notes from Aja Lechowicz, San Diego Realtor + Concierge." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Fraunces:ital,wght@0,400;0,500;1,400&family=Instrument+Serif:ital@0;1&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css?v=15" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
      <rect width="400" height="400" fill="#f6f4ee"/>
      <text x="200" y="220" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="44" fill="#0d1f29">Journal</text>
    </svg>
  </template>

  <header class="nav is-scrolled" style="position: sticky;">
    <a href="coast-homes-by-aja-v2.html" class="nav__brand">
      <img src="assets/logo-full.png" alt="Coast Homes by Aja" />
    </a>
    <nav class="nav__links">
      <a href="coast-homes-by-aja-v2.html#concierge">Services</a>
      <a href="coast-homes-by-aja-v2.html#about">About Aja</a>
      <a href="coast-homes-by-aja-v2.html#places">Lifestyle</a>
      <a href="blog.html" style="color: var(--accent)">Blog</a>
      <a href="coast-homes-by-aja-v2.html#faq">FAQ</a>
    </nav>
    <div class="nav__cta">
      <span class="nav__phone">San Diego Realtor + Concierge</span>
      <a class="nav__btn" href="coast-homes-by-aja-v2.html#wizard">Start my search</a>
    </div>
  </header>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function BlogIndex() {
      const [posts, setPosts] = useState([]);
      const [filter, setFilter] = useState("All");
      useEffect(() => {
        fetch("blog/posts.json").then(r => r.json()).then(d => setPosts(d.posts || []));
      }, []);
      const cats = ["All", ...Array.from(new Set(posts.map(p => p.category)))];
      const shown = filter === "All" ? posts : posts.filter(p => p.category === filter);
      const fmt = s => new Date(s).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });

      return (
        <main className="blog-index">
          <div className="blog-index__head">
            <span className="eyebrow">Journal</span>
            <h1>From the <em>desk</em>.</h1>
            <p>Market reads, neighborhood deep-dives, and the honest conversations I have with clients before we tour anything. New posts most weeks.</p>
          </div>
          <div className="blog-index__filter">
            {cats.map(c => (
              <button key={c} className={filter === c ? "active" : ""} onClick={() => setFilter(c)}>{c}</button>
            ))}
          </div>
          <div className="blog-index__list">
            {shown.map(p => (
              <a key={p.slug} className="blog-row" href={`post.html?slug=${p.slug}`}>
                <div className="blog-row__media">
                  <img src={`assets/${p.image}`} alt={p.title} />
                </div>
                <div className="blog-row__body">
                  <span className="kicker">{p.kicker}</span>
                  <h2>{p.title}</h2>
                  <p>{p.excerpt}</p>
                  <span className="meta">{fmt(p.date)} · {p.readTime} min read</span>
                </div>
              </a>
            ))}
          </div>
          <EmailCap />
        </main>
      );
    }

    function EmailCap() {
      const [email, setEmail] = useState("");
      const [done, setDone] = useState(false);
      const submit = (e) => {
        e.preventDefault();
        if (!email || !email.includes("@")) return;
        try { localStorage.setItem("coast_email_sub", email); } catch {}
        setDone(true);
      };
      return (
        <div className="blog-emailcap">
          <h3>One coast <em>note</em>, every Friday.</h3>
          <p>The week's market read, one neighborhood I'm watching, and the listing I'd buy if I were you. No filler.</p>
          {done ? (
            <p className="ok">✓ You're on the list. Talk Friday.</p>
          ) : (
            <form onSubmit={submit}>
              <input type="email" placeholder="you@email.com" value={email} onChange={e => setEmail(e.target.value)} required />
              <button type="submit">Subscribe</button>
            </form>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<BlogIndex />);
  </script>

  <footer class="foot">
    <div class="foot__sub" style="border-top: 1px solid var(--rule); padding-top: 32px;">
      <span>© 2026 Coast Homes by Aja</span>
      <span>DRE #01918735 · <a href="coast-homes-by-aja-v2.html">Back to home →</a></span>
    </div>
  </footer>
</body>
</html>
